steps:
  - step_title: 1. Make input and output folders
    step_command: mkdir -p {job_workdir}/scan{job_scan_id}

  - step_title: 2. Create lesion CSV for the VAE radiomics job
    step_command: bash -c "printf 'image_path,mask_path,lesion_id\n/input/RESOURCES/nsclc-segmentation-codebase-20260317/scan{job_scan_id}/ct_struct.nii.gz,/input/RESOURCES/nsclc-segmentation-codebase-20260317/scan{job_scan_id}/lesion_mask.nii.gz,Tumor_001\n' > {job_workdir}/scan{job_scan_id}/lesions.csv"

  - step_title: 3. Run lung tumor VAE radiomics feature extraction
    step_command: micromamba run -p {g_env_repo_dir} python -m vae_radiomics --checkpoint /opt/packages/user/alg_repo/radiomics-toolbox-nsclc-codebase-20260318/checkpoints/Saved_VAE3D.ckpt --csv {job_workdir}/scan{job_scan_id}/"lesions.csv" --output {job_workdir}/scan{job_scan_id}/features --format both

  - step_title: 4. Upload outputs to the session resource
    step_command: micromamba run -n base python {g_pymipl_dir}/xnat_workflow/sync-resource-with-xnat.py --level experiment --project {g_project} --subject {job_subject} --experiment {job_exp_label} --local_resource {job_workdir} --remote_resource {g_workflow_id} --create_hierarchy 1
